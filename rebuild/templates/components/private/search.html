<form method="get" class="lot2-filters" role="search"><div class="champ"><label for="q">Rechercher un nom ou une profession partagée</label><input class="champ__input" id="q" name="q" type="search" maxlength="100" value="{{ request.GET.q }}"></div><div class="champ"><label for="role">Rôle actuel</label><select class="champ__input" id="role" name="role"><option value="">Tous</option>{% for value,label in roles %}<option value="{{ value }}"{% if request.GET.role == value %} selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>{% if statuses %}<div class="champ"><label for="status">Statut</label><select class="champ__input" id="status" name="status"><option value="">Tous</option>{% for value,label in statuses %}<option value="{{ value }}"{% if request.GET.status == value %} selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>{% endif %}<button type="submit" class="btn btn--solid">Rechercher</button></form>
