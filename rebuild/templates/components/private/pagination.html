{% if page_obj.has_other_pages %}<nav class="lot2-actions" aria-label="Pagination">{% if page_obj.has_previous %}<a href="?q={{ request.GET.q|urlencode }}&amp;role={{ request.GET.role|urlencode }}&amp;status={{ request.GET.status|urlencode }}&amp;page={{ page_obj.previous_page_number }}">Précédente</a>{% endif %}<span>Page {{ page_obj.number }} sur {{ page_obj.paginator.num_pages }}</span>{% if page_obj.has_next %}<a href="?q={{ request.GET.q|urlencode }}&amp;role={{ request.GET.role|urlencode }}&amp;status={{ request.GET.status|urlencode }}&amp;page={{ page_obj.next_page_number }}">Suivante</a>{% endif %}</nav>{% endif %}
