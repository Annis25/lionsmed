{% if form.errors %}<div class="form-errors" role="alert" tabindex="-1"><p>Vérifiez les informations du formulaire.</p>{{ form.non_field_errors }}<ul>{% for field in form %}{% if field.errors %}<li><a href="#{{ field.id_for_label }}">{{ field.label }} : {{ field.errors|striptags }}</a></li>{% endif %}{% endfor %}</ul></div>{% endif %}
