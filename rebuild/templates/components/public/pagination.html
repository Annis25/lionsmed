{% if page_obj.has_other_pages %}<nav class="lot3-pagination" aria-label="Pagination">{% if page_obj.has_previous %}<a href="?page={{ page_obj.previous_page_number }}&amp;axis={{ request.GET.axis|urlencode }}&amp;q={{ request.GET.q|urlencode }}&amp;archive={{ request.GET.archive|urlencode }}">Précédente</a>{% endif %}<span>Page {{ page_obj.number }} sur {{ page_obj.paginator.num_pages }}</span>{% if page_obj.has_next %}<a href="?page={{ page_obj.next_page_number }}&amp;axis={{ request.GET.axis|urlencode }}&amp;q={{ request.GET.q|urlencode }}&amp;archive={{ request.GET.archive|urlencode }}">Suivante</a>{% endif %}</nav>{% endif %}
