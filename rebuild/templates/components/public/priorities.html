<section class="section section--fond" id="axes"><div class="container"><div class="section-head"><h2>Nos axes d’engagement</h2><p>{{ axes_intro|linebreaksbr }}</p></div><div class="axis-list">{% for axis in axis_sections %}<article><span class="grand-repere" aria-hidden="true">0{{ forloop.counter }}</span><div><h3>{{ axis.label }}</h3><p>{% if axis.section %}{{ axis.section.body|linebreaksbr }}{% else %}{{ axis.default_body }}{% endif %}</p><a href="{% url 'actions:list' %}?axis={{ axis.value }}">Découvrir nos actions : {{ axis.label }}</a></div></article>{% endfor %}</div></div></section>
