<section class="section section--fond" id="axes"><div class="container"><div class="section-head"><h2>Nos quatre priorités</h2><p>Diabète, environnement, humanitaire et jeunesse guident notre engagement.</p></div><div class="axis-list">{% for axis in axis_sections %}<article><span class="grand-repere" aria-hidden="true">0{{ forloop.counter }}</span><div><h3>{{ axis.label }}</h3>{% if axis.section %}<p>{{ axis.section.body|linebreaksbr }}</p>{% endif %}<a href="{% url 'actions:list' %}?axis={{ axis.value }}">Découvrir nos actions : {{ axis.label }}</a></div></article>{% endfor %}</div></div></section>
