<script src="https://cdn.tailwindcss.com"></script>

      extend: {
        colors: {
          navy: {
            50:'#EEF2F8',100:'#D5DFF0',200:'#ABBFE0',300:'#7F9FCF',400:'#557FBE',

            500:'#C9A84C',600:'#A8862A',700:'#7D641F',800:'#534215',900:'#29210A',
          },
          ivory: '#F8F6F0',

          /* ── Couleurs relevées au pixel près sur logomed.png ──
             lions #184898 = 63 % des pixels du logo (bleu de marque)
             sun   #F8C800 = 33 % des pixels du logo (jaune de marque)
             Ce sont désormais les couleurs primaires de la page ; navy et

<style>
  /* ── Cadre bleu marine tout autour de la page ── */
  body {
    border: 3px solid #184898;
    min-height: 100vh;
  }

  /* ── Révélation au défilement (repris de static/css/main.css) ── */
  .reveal {
    opacity: 0;
    transform: translateY(24px);
    transition: opacity .7s cubic-bezier(.16,1,.3,1), transform .7s cubic-bezier(.16,1,.3,1);
  }
  .reveal.visible { opacity: 1; transform: translateY(0); }
  .reveal:nth-child(2) { transition-delay: .08s; }
  .reveal:nth-child(3) { transition-delay: .16s; }
  .reveal:nth-child(4) { transition-delay: .24s; }
  .reveal:nth-child(5) { transition-delay: .32s; }
  .reveal:nth-child(6) { transition-delay: .40s; }

  .card-hover { transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease; }
  .card-hover:hover { transform: translateY(-4px); box-shadow: 0 18px 40px -18px rgba(11,31,58,.28); }

  /* ── Indicateur de défilement ── */
  @keyframes scroll-pulse {
    0%,100% { opacity: .25; transform: scaleY(.7); }
    50%     { opacity: .8;  transform: scaleY(1); }
  }
  .scroll-line { animation: scroll-pulse 2.2s ease-in-out infinite; transform-origin: top; }

  /* ── Accessibilité : focus visible ── */
  a:focus-visible, button:focus-visible {
    outline: 2px solid #C9A84C;
    outline-offset: 3px;
    border-radius: 4px;
  }

  /* ── Respect de la préférence « animations réduites » ── */
  @media (prefers-reduced-motion: reduce) {
    .reveal { opacity: 1; transform: none; transition: none; }
    .scroll-line { animation: none; }
    html { scroll-behavior: auto; }
  }
</style>
</head>

<header class="pt-12 pb-2">
  <a href="accueil.html" class="flex justify-center" aria-label="Lions Sfax Med — accueil">
    <img src="logomed.png" alt="Lions Sfax Med" class="h-[58px] w-auto" width="1006" height="557" />

<main class="flex-1 flex items-center justify-center px-6 py-12">
  <div class="w-full max-w-[440px]">
    <div class="reveal text-center mb-8">
      <h1 class="font-serif text-[30px] font-bold text-lions-700 mb-3">Espace membre</h1>
      <p class="text-lions-800/60 text-[14.5px] leading-relaxed">Connectez-vous pour accéder à votre espace personnel, au calendrier et aux documents du club.</p>
    </div>

    <div class="reveal bg-white rounded-2xl border border-lions-100 shadow-sm p-8 sm:p-9">
      <form class="space-y-5" onsubmit="event.preventDefault(); alert('Maquette : le formulaire n\'est pas actif.');">
        <div>
          <label for="l-email" class="block text-[11px] font-bold text-lions-600 uppercase tracking-[0.14em] mb-2">Adresse e-mail</label>
          <input id="l-email" type="email" autocomplete="email" placeholder="votre@email.com" class="w-full px-4 py-3 text-[14px] bg-lions-50/60 border border-lions-100 rounded-lg outline-none focus:border-sun-500 focus:bg-white transition-colors placeholder-lions-300">
        </div>

        <div>
          <label for="l-mdp" class="block text-[11px] font-bold text-lions-600 uppercase tracking-[0.14em] mb-2">Mot de passe</label>
          <div class="relative">
            <input id="l-mdp" type="password" autocomplete="current-password" placeholder="••••••••••••"
                   class="w-full px-4 py-3 text-[14px] bg-lions-50/60 border border-lions-100 rounded-lg outline-none focus:border-sun-500 focus:bg-white transition-colors placeholder-lions-300 pr-12">
            <button type="button" id="bascule-mdp" aria-label="Afficher le mot de passe" aria-pressed="false"
                    class="absolute right-3 top-1/2 -translate-y-1/2 p-1.5 text-lions-400 hover:text-lions-600 transition-colors">
              <svg id="oeil-ouvert" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.5 12C3.7 7.9 7.5 5 12 5s8.3 2.9 9.5 7c-1.2 4.1-5 7-9.5 7s-8.3-2.9-9.5-7z"/>
              </svg>
              <svg id="oeil-barre" class="w-5 h-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13.9 18.8A10 10 0 0112 19c-4.5 0-8.3-2.9-9.5-7a10 10 0 011.6-3M9.9 5.2A10 10 0 0112 5c4.5 0 8.3 2.9 9.5 7a10 10 0 01-4.1 5.4M9.9 9.9a3 3 0 104.2 4.2M3 3l18 18"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="flex items-center justify-between pt-1">
          <label class="flex items-center gap-2.5 cursor-pointer">
            <input type="checkbox" class="w-4 h-4 rounded border-lions-200 text-lions-500 focus:ring-sun-500">
            <span class="text-lions-800/65 text-[13.5px]">Se souvenir de moi</span>
          </label>
        </div>

        <button type="submit"
                class="w-full inline-flex items-center justify-center gap-2 px-8 py-3.5 rounded-lg
                       bg-sun-500 hover:bg-sun-400 text-lions-800 font-bold text-[15px]
                       shadow-lg shadow-sun-500/25 transition-all duration-200 hover:-translate-y-0.5">

      </form>

      <p class="text-center mt-6">

    <p class="reveal text-center text-lions-800/55 text-[13.5px] mt-7">

    <p class="reveal text-center mt-4">

<footer class="py-8 text-center">
  <p class="text-lions-800/40 text-[12.5px]">© 2026 <span data-club-full>Lions Sfax Med</span> — District 414-B Tunisie</p>
</footer>

<script>
<script>
/* ═══════════════════════════════════════════════════════════════════════
   NOM DU CLUB
   ═══════════════════════════════════════════════════════════════════════
   Le logo officiel (logomed.png) porte la mention « Lions Sfax Med » :
   c'est donc ce nom qui est repris ici. Il reste centralisé dans ces deux
   constantes, injectées partout où le nom apparaît (titre du hero, pied de
   page, onglet du navigateur). Modifier ces lignes suffit à tout changer. */

const CLUB_NAME  = 'Sfax Med';   // titre jaune du hero — repris du logo officiel
const CLUB_SHORT = 'SFAX MED';   // variantes en petites capitales

/* ─── Injection (ne rien modifier en dessous) ─────────────────────────── */
document.querySelectorAll('[data-club-name]').forEach(el => {
  el.textContent = CLUB_NAME;
});
document.querySelectorAll('[data-club-short]').forEach(el => {
  el.textContent = CLUB_SHORT;
});
document.querySelectorAll('[data-club-full]').forEach(el => {
  el.textContent = el.textContent.replace(/Lions Sfax Med/g, 'Lions Club ' + CLUB_NAME);
});
document.title = 'Maquette — Espace membre | Lions ' + CLUB_NAME;


/* ═══════════════════════════════════════════════════════════════════════
   INTERACTIONS
   ═══════════════════════════════════════════════════════════════════════ */

/* Révélation au chargement */
document.querySelectorAll('.reveal').forEach(el => el.classList.add('visible'));

/* ── Affichage / masquage du mot de passe ──────────────────────────────── */
const bascule = document.getElementById('bascule-mdp');
if (bascule) {
  const champ = document.getElementById('l-mdp');
  const ouvert = document.getElementById('oeil-ouvert');
  const barre = document.getElementById('oeil-barre');
  bascule.addEventListener('click', () => {
    const visible = champ.type === 'text';
    champ.type = visible ? 'password' : 'text';
    ouvert.classList.toggle('hidden', !visible);
    barre.classList.toggle('hidden', visible);
    bascule.setAttribute('aria-pressed', String(!visible));
    bascule.setAttribute('aria-label', visible ? 'Afficher le mot de passe' : 'Masquer le mot de passe');
  });
}

</script>
